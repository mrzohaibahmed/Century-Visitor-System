<!doctype html>
<!--
  Overstay e-mail to a host or a department (services/email.py). Dollar placeholders are HTML-escaped;
  the rows placeholder is a pre-built, escaped table. Inline styles only: many mail programs ignore style blocks.
-->
<html>
<body style="margin:0;background:#f3f5f8;font-family:Segoe UI,Arial,sans-serif;color:#111827">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:24px 0">
    <tr><td align="center">
      <table role="presentation" width="560" cellpadding="0" cellspacing="0"
             style="background:#ffffff;border:1px solid #dde3ea;border-radius:12px">
        <tr>
          <td style="background:#7a2e0e;color:#ffffff;padding:16px 24px;border-radius:12px 12px 0 0;
                     font-size:14px;font-weight:700;letter-spacing:.04em">${org_upper} &middot; VISITOR OVERSTAY</td>
        </tr>
        <tr>
          <td style="padding:24px">
            <p style="margin:0 0 12px">Dear ${greeting},</p>
            <p style="margin:0 0 16px;font-size:16px"><strong>${visitor}</strong> is still on site after their
              badge expired (gate closing). Please arrange check-out.</p>
            <table role="presentation" cellpadding="0" cellspacing="0" style="font-size:14px">${rows}</table>
          </td>
        </tr>
        <tr>
          <td style="padding:12px 24px 20px;font-size:12px;color:#5b6573">
            ${org} visitor management. This message was sent automatically; please do not reply.
          </td>
        </tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
